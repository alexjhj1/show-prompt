<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>스탠드업 프롬프터</title>
<!-- 아이폰 홈 화면에 추가했을 때 앱처럼 열리게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="프롬프터">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e10">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="setup">
  <!-- 볼드체를 지키려고 textarea 대신 서식이 남는 입력 칸을 쓴다 -->
  <div id="src" class="empty" contenteditable="true" data-placeholder="대본을 붙여넣으세요" role="textbox" aria-multiline="true" aria-label="대본"></div>
  <div id="opts">
  <div class="row">
    <button class="btn" id="clearBtn">지우기</button>
    <span class="stat" id="stat"></span>
  </div>

  <div class="card">
    <div class="slider">속도 <input type="range" id="speed" min="1" max="10" step="1" value="5" aria-label="속도"> <span id="speedV" class="stat">5</span> <button class="btn mini" id="speedReset" type="button">기본</button></div>
    <div class="slider">크기 <input type="range" id="size" min="12" max="40" value="17" aria-label="글자 크기"> <span id="sizeV" class="stat">17</span> <button class="btn mini" id="sizeReset" type="button">기본</button></div>
  </div>

  <button class="btn primary" id="startBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg> 시작</button>
  </div>
</section>

<section id="stage">
  <div id="scroller"></div>
  <div id="fadeT"></div><div id="fadeB"></div>
  <div id="toast"></div>
  <div id="hud">
    <button class="btn" id="backBtn" aria-label="닫기">✕</button>
    <button class="btn big" id="slowBtn" aria-label="느리게">−</button>
    <button class="btn big" id="playBtn" aria-label="재생 또는 일시정지"></button>
    <button class="btn big" id="fastBtn" aria-label="빠르게">+</button>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
