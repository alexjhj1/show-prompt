<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Show Prompt</title>
<!-- 아이폰 홈 화면에 추가했을 때 앱처럼 열리게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Show Prompt">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafafa">
<link rel="apple-touch-icon" href="icon.png">
<!-- 글꼴: 프리텐다드 (400·500·700만 쓴다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="setup">
  <!-- 볼드체를 지키려고 textarea 대신 서식이 남는 입력 칸을 쓴다 -->
  <div id="src" class="empty" contenteditable="true" role="textbox" aria-multiline="true" aria-label="대본"></div>
  <!-- 입력 칸 위에 얹은 안내. 진짜 글자가 아니라서 대본과 글자 수에 들어가지 않는다 -->
  <div id="hint" aria-hidden="true">메모장에 있는 대본을 붙여넣으세요<br>아이폰 메모장 기본 글씨 크기는 17입니다<br><br><b>볼드체</b> = <b class="y">잽</b><br><u>밑줄</u> = <span class="r">펀치</span></div>
  <div id="opts">
  <div class="row">
    <button class="btn key" id="pasteBtn" type="button">붙여넣기</button>
    <button class="btn key" id="clearBtn">지우기</button>
    <span class="stat" id="stat"></span>
  </div>

  <input type="hidden" id="speed" value="9">
  <input type="hidden" id="size" value="17">
  <div class="card">
    <div class="slider" id="readRow"><span class="lab">읽기</span>
      <button class="btn key" id="readBtn" type="button"></button>
      <select id="voice" aria-label="목소리"></select>
    </div>
    <!-- Gemini 음성일 때만 보이는 미리 받기. 말투는 '친구한테 수다 떨듯'으로 정해져 있다 -->
    <div class="slider" id="styleRow"><span class="lab">받기</span>
      <button class="btn key" id="fetchBtn" type="button">대본 음성 미리 받기</button>
    </div>
    <div class="slider"><span class="lab">속도</span>
      <button class="btn key step" id="speedDown" type="button" aria-label="느리게">−</button>
      <span id="speedV" class="val">9</span>
      <button class="btn key step" id="speedUp" type="button" aria-label="빠르게">+</button>
      <button class="btn key mini" id="speedReset" type="button">기본</button>
    </div>
    <div class="slider"><span class="lab">크기</span>
      <button class="btn key step" id="sizeDown" type="button" aria-label="글자 작게">−</button>
      <span id="sizeV" class="val">17</span>
      <button class="btn key step" id="sizeUp" type="button" aria-label="글자 크게">+</button>
      <button class="btn key mini" id="sizeReset" type="button">기본</button>
    </div>
  </div>

  <button class="btn key primary" id="startBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg> 시작</button>
  </div>
</section>

<section id="stage">
  <!-- 촬영 모드: 앞 카메라 화면을 대본 뒤에 깐다 -->
  <video id="cam" playsinline muted autoplay></video>
  <div id="scroller"></div>
  <div id="fadeT"></div><div id="fadeB"></div>
  <div id="toast"></div>
  <button class="btn key" id="saveBtn" type="button" hidden>영상 저장</button>
  <button class="btn key" id="topBtn" type="button" aria-label="맨 위로"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 4 13.5h5v6h6v-6h5z"/></svg></button>
  <div id="hud">
    <button class="btn key" id="backBtn" aria-label="닫기">✕</button>
    <button class="btn key" id="camBtn" aria-label="촬영 모드"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.6-2h6.8L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 2.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></button>
    <button class="btn key big" id="slowBtn" aria-label="느리게">−</button>
    <button class="btn key big" id="playBtn" aria-label="재생 또는 일시정지"></button>
    <button class="btn key big" id="fastBtn" aria-label="빠르게">+</button>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
